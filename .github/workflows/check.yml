name: Check

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  # A pushed range is validated only by its own run, so only pull request runs may be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Run Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every check on Linux.
          - os: ubuntu-latest
            target: all
          # start.sh must run under the 3.2 bash that macOS ships, which Linux runners lack.
          - os: macos-latest
            target: bash32
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # gitleaks scans the full history.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise and the pinned tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b  # v5.2.7
        with:
          version: 2026.11.7

      - name: Run the checks for this runner
        env:
          # The commit before the new commits: a push's previous head, or a pull request's base.
          CHECK_BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
          CHECK_TARGET: ${{ matrix.target }}
        run: scripts/check.sh "$CHECK_TARGET"
