# Tool configuration only: this repository has no installable Python project.
# scripts/check.sh runs ruff, mypy, and pytest through `uv run --no-project`.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["prove.py", "start.py", "start_base.py", "start_identity.py", "prove_engine", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
